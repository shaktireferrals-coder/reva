services:
  - type: web
    name: reva-electronics-backend
    runtime: node
    plan: starter
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
    region: oregon
    repo: https://github.com/shaktireferrals-coder/reva

  - type: web
    name: reva-electronics-frontend
    runtime: static
    staticPublishPath: frontend/dist
    buildCommand: cd frontend && npm install && npm run build
    region: oregon
    repo: https://github.com/shaktireferrals-coder/reva
